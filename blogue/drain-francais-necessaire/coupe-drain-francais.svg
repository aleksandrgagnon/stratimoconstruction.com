<svg xmlns="http://www.w3.org/2000/svg" viewBox="190 0 770 600" role="img" aria-labelledby="dc-t dc-d" font-family="Barlow, Arial, sans-serif">
          <title id="dc-t">Coupe d'une fondation avec drain français</title>
          <desc id="dc-d">L'eau de pluie et de fonte traverse le remblai, descend dans la pierre nette jusqu'au drain perforé posé au pied de la fondation, puis est évacuée par le drain. Une membrane protège le mur et le terrain est en pente pour éloigner l'eau.</desc>
          <defs>
            <pattern id="dc-stone" width="16" height="16" patternUnits="userSpaceOnUse">
              <rect width="16" height="16" fill="#c4c8cf"/>
              <circle cx="4" cy="4" r="3" fill="#8f96a1"/><circle cx="12" cy="9" r="3.4" fill="#9ca2ac"/><circle cx="5" cy="13" r="2.4" fill="#858c97"/>
            </pattern>
            <pattern id="dc-fill" width="14" height="14" patternUnits="userSpaceOnUse">
              <rect width="14" height="14" fill="#d8c5a0"/><circle cx="3" cy="4" r="1.2" fill="#b9a37a"/><circle cx="10" cy="10" r="1.1" fill="#b9a37a"/>
            </pattern>
            <pattern id="dc-clay" width="22" height="22" patternUnits="userSpaceOnUse">
              <rect width="22" height="22" fill="#b7996b"/><path d="M0 11h22M11 0v6M11 16v6" stroke="#a5875a" stroke-width="1.2"/>
            </pattern>
            <pattern id="dc-concrete" width="18" height="18" patternUnits="userSpaceOnUse">
              <rect width="18" height="18" fill="#c9cdd3"/><circle cx="5" cy="6" r="1" fill="#a9aeb6"/><circle cx="13" cy="13" r="1.2" fill="#a9aeb6"/><path d="M9 2l2 2" stroke="#a9aeb6"/>
            </pattern>
            <marker id="dc-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M0 0L10 5L0 10z" fill="#1f7ad1"/>
            </marker>
          </defs>
        
          <!-- ciel / fond -->
          <rect x="190" width="770" height="600" fill="#f4f6fa"/>
        
          <!-- sol naturel (argile) -->
          <path d="M300 172 L960 196 L960 600 L300 600 Z" fill="url(#dc-clay)"/>
          <!-- zone excavée remplie de remblai -->
          <path d="M300 172 L560 181 L470 470 L300 470 Z" fill="url(#dc-fill)"/>
          <path d="M560 181 L470 470" stroke="#8a6f45" stroke-width="2" stroke-dasharray="7 5" fill="none"/>
          <!-- herbe / terrain en pente -->
          <path d="M300 172 L960 196" stroke="#4d8a3f" stroke-width="6" fill="none"/>
        
          <!-- sol sous la semelle -->
          <rect x="190" y="546" width="112" height="54" fill="url(#dc-clay)"/>
          <!-- mur de fondation -->
          <rect x="240" y="90" width="58" height="406" fill="url(#dc-concrete)" stroke="#8d939c" stroke-width="1.5"/>
          <!-- maison au-dessus -->
          <rect x="226" y="20" width="86" height="70" fill="#e9eef5" stroke="#8d939c"/>
          <!-- membrane d'imperméabilisation -->
          <path d="M300 168 V496" stroke="#1f2a40" stroke-width="5"/>
        
          <!-- pierre nette + géotextile -->
          <path d="M302 400 H470 V560 H340 V496 H302 Z" fill="url(#dc-stone)"/>
          <path d="M302 400 H470 V560 H340" stroke="#2f6b4f" stroke-width="3" stroke-dasharray="9 6" fill="none"/>
          <!-- semelle -->
          <rect x="200" y="496" width="140" height="50" fill="url(#dc-concrete)" stroke="#8d939c" stroke-width="1.5"/>
          <!-- drain perforé -->
          <circle cx="408" cy="520" r="24" fill="#f7f7f7" stroke="#33415c" stroke-width="4"/>
          <circle cx="408" cy="520" r="15" fill="#e8edf3"/>
          <g fill="#33415c"><circle cx="408" cy="499" r="2.6"/><circle cx="390" cy="508" r="2.6"/><circle cx="426" cy="508" r="2.6"/><circle cx="386" cy="526" r="2.6"/><circle cx="430" cy="526" r="2.6"/></g>
        
          <!-- gouttière et rallonge -->
          <path d="M312 30 H330 V160 Q330 168 338 168 H420" stroke="#5b6880" stroke-width="7" fill="none" stroke-linecap="round"/>
          <path d="M424 168 L470 172" stroke="#1f7ad1" stroke-width="3" fill="none" marker-end="url(#dc-arrow)"/>
        
          <!-- pluie -->
          <g stroke="#1f7ad1" stroke-width="2.5" stroke-linecap="round" opacity=".8">
            <path d="M620 70 l-8 22"/><path d="M680 50 l-8 22"/><path d="M740 78 l-8 22"/><path d="M800 52 l-8 22"/><path d="M860 74 l-8 22"/><path d="M560 60 l-8 22"/>
          </g>
          <!-- chemin de l'eau dans le sol -->
          <g stroke="#1f7ad1" stroke-width="3.5" fill="none" marker-end="url(#dc-arrow)">
            <path d="M520 205 C500 270 470 330 440 392"/>
            <path d="M400 200 C390 270 380 330 372 392"/>
            <path d="M650 215 C600 300 520 380 476 452"/>
          </g>
          <g stroke="#1f7ad1" stroke-width="3" fill="none" marker-end="url(#dc-arrow)">
            <path d="M350 440 C362 468 376 488 386 500"/>
            <path d="M462 470 C452 484 442 494 432 502"/>
          </g>
          <!-- flèche pente -->
          <path d="M640 140 L760 146" stroke="#3f7a33" stroke-width="3" fill="none" marker-end="url(#dc-arrow)"/>
        
          <!-- étiquettes de zones -->
          <g font-size="22" font-weight="700" fill="#33415c" letter-spacing=".5">
            <text x="269" y="62" font-size="16" font-weight="600" fill="#5b6880" text-anchor="middle">MAISON</text>
            <text x="760" y="560" fill="#5c4524">SOL NATUREL</text>
          </g>
        
          <!-- repères numérotés -->
          <g font-size="20" font-weight="700" text-anchor="middle">
            <g><line x1="319" y1="250" x2="302" y2="250" stroke="#1f2a40" stroke-width="1.5"/><circle cx="335" cy="250" r="16" fill="#1f2a40"/><text x="335" y="257" fill="#fff">1</text></g>
            <g><line x1="432" y1="520" x2="540" y2="520" stroke="#1f2a40" stroke-width="1.5"/><circle cx="556" cy="520" r="16" fill="#1f2a40"/><text x="556" y="527" fill="#fff">2</text></g>
            <g><circle cx="330" cy="440" r="16" fill="#1f2a40"/><text x="330" y="447" fill="#fff">3</text></g>
            <g><line x1="470" y1="430" x2="540" y2="430" stroke="#1f2a40" stroke-width="1.5"/><circle cx="556" cy="430" r="16" fill="#1f2a40"/><text x="556" y="437" fill="#fff">4</text></g>
            <g><circle cx="270" cy="521" r="16" fill="#1f2a40"/><text x="270" y="528" fill="#fff">5</text></g>
            <g><circle cx="430" cy="270" r="16" fill="#1f2a40"/><text x="430" y="277" fill="#fff">6</text></g>
            <g><circle cx="700" cy="400" r="16" fill="#1f2a40"/><text x="700" y="407" fill="#fff">7</text></g>
                <g><circle cx="700" cy="120" r="16" fill="#1f2a40"/><text x="700" y="127" fill="#fff">8</text></g>
            <g><circle cx="380" cy="130" r="16" fill="#1f2a40"/><text x="380" y="137" fill="#fff">9</text><line x1="380" y1="146" x2="380" y2="164" stroke="#1f2a40" stroke-width="1.5"/></g>
          </g>
        </svg>